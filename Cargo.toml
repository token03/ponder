[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
ponder-game = { path = "crates/ponder-game" }
ponder-net = { path = "crates/ponder-net" }
ponder = { path = "crates/ponder" }
ponder-rules = { path = "crates/ponder-rules" }
ponder-solve = { path = "crates/ponder-solve" }
ponder-plan = { path = "crates/ponder-plan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
faer = { version = "0.24", default-features = false, features = ["std"] }
rayon = "1"
rustc-hash = "2"
regex = "1"
ureq = "3"
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
blake3 = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
percent-encoding = "2"
form_urlencoded = "1"

# Edit-build loop: light debug info, dependencies optimised, our crates at opt-level 1
# (tests solve hundreds of real problems; at opt-level 0 that takes minutes), and the
# solver itself fully optimised since it is the hot loop and rarely edited.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.ponder-solve]
opt-level = 3

[profile.dev.package.ponder-game]
opt-level = 3

[profile.dev.package.ponder-app]
opt-level = 0

[profile.release]
debug = "line-tables-only"
