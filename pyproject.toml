[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ponder"
version = "0.1.0"
description = "Mine Path of Exile builds for profitable crafting candidates."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "rich>=15.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "textual>=8.2.8"]  # textual so `uv sync` gets the TUI too

[project.scripts]
ponder = "ponder.cli:main"
ponder-tui = "ponder.tui:main"

[project.optional-dependencies]
tui = [
    "textual>=8.2.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
