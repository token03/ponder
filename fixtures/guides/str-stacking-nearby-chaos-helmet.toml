mods = [{ text = "Nearby Enemies have #% to Chaos Resistance / #% to Chaos Resistance", source = "elevated" }]

[stages.awakened]
mods = [
  { text = "Gain Accuracy Rating equal to your Strength / #% increased Critical Strike Chance per # Strength", source = "elevated" },
  { text = "Nearby Enemies have #% to Chaos Resistance / #% to Chaos Resistance", source = "elevated" },
  { text = "+# to Strength", tier = 1 },
]
open_prefix = 1

[[steps]]
item = "warlord"
do = ["buy:base", "influence-exalted:warlord", "scouring", "remembrance"]
until = "strands"

[[steps]]
item = "warlord"
do = ["bench:any-mod", "imprint", "regal", "harvest:reforge-attack"]
until = "accuracy"

[[steps]]
item = "warlord"
do = ["dominance", "bench:suffixes-cannot-be-changed", "scouring"]
until = "accuracy_elevated"
