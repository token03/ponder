else = 2

[[steps]]
item = "hunter"
do = ["buy:chaos"]

[[steps]]
do = ["beast:lock", "awakener:hunter+warlord", "chromatic"]
until = "awakened"

[[steps]]
do = ["bench:suffixes-cannot-be-changed", "harvest:reforge-life"]
until = "goal"
