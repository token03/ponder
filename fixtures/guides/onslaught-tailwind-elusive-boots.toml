sheet = "OnslaughtTailwindElusive Boots"
base = "Fugitive Boots"
ilvl = 84
influences = ["redeemer", "hunter"]

[goal]
mods = [
  { text = "#% chance to gain Onslaught for # seconds on Kill / #% increased Attack, Cast and Movement Speed while you have Onslaught", source = "elevated" },
  { text = "You have Tailwind if you have dealt a Critical Strike Recently / #% increased Effect of Tailwind on you", source = "elevated" },
  { text = ["+#% to Fire Resistance", "+#% to Cold Resistance", "+#% to Lightning Resistance"], tier = 1 },
  { text = "#% chance to gain Elusive on Critical Strike", source = "influence" },
  { text = "#% increased Movement Speed", source = "veiled" },
  { text = "+# to maximum Life", source = "crafted" },
]

[stages.strands]
influences = ["redeemer"]
rarity = "normal"

[stages.onslaught]
influences = ["redeemer"]
mods = [{ text = "#% chance to gain Onslaught for # seconds on Kill", source = "influence" }]
min_mods = 2
open_suffix = 1

[stages.onslaught_elevated]
influences = ["redeemer"]
rarity = "magic"
mods = [{ text = "#% chance to gain Onslaught for # seconds on Kill / #% increased Attack, Cast and Movement Speed while you have Onslaught", source = "elevated" }]
max_suffix = 1
max_prefix = 0

[stages.tailwind]
influences = ["hunter"]
mods = [{ text = "You have Tailwind if you have dealt a Critical Strike Recently / #% increased Effect of Tailwind on you", source = "elevated" }]

[stages.awakened]
mods = [
  { text = "#% chance to gain Onslaught for # seconds on Kill / #% increased Attack, Cast and Movement Speed while you have Onslaught", source = "elevated" },
  { text = "You have Tailwind if you have dealt a Critical Strike Recently / #% increased Effect of Tailwind on you", source = "elevated" },
  { text = ["+#% to Fire Resistance", "+#% to Cold Resistance", "+#% to Lightning Resistance"], tier = 1 },
]
open_prefix = 1

[stages.elusive]
mods = [
  { text = "#% chance to gain Onslaught for # seconds on Kill / #% increased Attack, Cast and Movement Speed while you have Onslaught", source = "elevated" },
  { text = "You have Tailwind if you have dealt a Critical Strike Recently / #% increased Effect of Tailwind on you", source = "elevated" },
  { text = ["+#% to Fire Resistance", "+#% to Cold Resistance", "+#% to Lightning Resistance"], tier = 1 },
  { text = "#% chance to gain Elusive on Critical Strike", source = "influence" },
]

[[steps]]
item = "onslaught"
do = ["buy:base", "influence-exalted:redeemer", "scouring", "remembrance"]
until = "strands"

[[steps]]
item = "onslaught"
do = ["bench:any-mod", "imprint", "regal", "harvest:reforge-physical"]
until = "onslaught"

[[steps]]
item = "onslaught"
do = ["dominance", "bench:suffixes-cannot-be-changed", "scouring"]
until = "onslaught_elevated"
max = 1
else = 2

[[steps]]
item = "tailwind"
do = ["buy:tailwind"]

[[steps]]
do = ["beast:lock", "awakener:tailwind+onslaught", "chromatic"]
until = "awakened"

[[steps]]
do = ["bench:suffixes-cannot-be-changed", "harvest:reforge-critical"]
until = "elusive"
note = "Reforge critical with suffixes locked guarantees Elusive here."

[[steps]]
do = ["bench:suffixes-cannot-be-changed", "veiled-exalted", "unveil:movement-speed", "bench:life"]
until = "goal"
note = "The veiled exalt lands on the crafted-mod side half the time."
