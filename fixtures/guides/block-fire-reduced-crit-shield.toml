sheet = "BlockFireRedu Crit DmgPerBlock "
base = "Heat-attuned Tower Shield"
ilvl = 86
scope = "Non-influenced donors, then a final Crusader slam. Conservative restart on failed fire/slam branches; does not encode every manual repair."

[goal]
influences = ["crusader"]
mods = [
  { text = "#% increased Chance to Block", tier = 1 },
  { text = "#% Chance to Block Spell Damage", tier = 1 },
  { text = "You take #% reduced Extra Damage from Critical Strikes", tier = 2 },
  { text = "+#% to Fire Resistance", tier = 2 },
  { text = "#% increased Damage per #% Chance to Block Attack Damage", source = "influence" },
  { text = "+#% to Fire and Chaos Resistances", source = "crafted" },
]

[stages.block]
rarity = "magic"
mods = [{ text = "#% increased Chance to Block", tier = 1 }]

[stages.spell_block]
rarity = "magic"
mods = [{ text = "#% Chance to Block Spell Damage", tier = 1 }]

[stages.blocks]
mods = [{ text = "#% increased Chance to Block", tier = 1 }, { text = "#% Chance to Block Spell Damage", tier = 1 }]
open_prefix = 1
open_suffix = 2

[stages.critical]
mods = [
  { text = "#% increased Chance to Block", tier = 1 },
  { text = "#% Chance to Block Spell Damage", tier = 1 },
  { text = "You take #% reduced Extra Damage from Critical Strikes", tier = 2 },
]
open_prefix = 1
max_suffix = 1

[stages.fire]
mods = [
  { text = "#% increased Chance to Block", tier = 1 },
  { text = "#% Chance to Block Spell Damage", tier = 1 },
  { text = "You take #% reduced Extra Damage from Critical Strikes", tier = 2 },
  { text = "+#% to Fire Resistance", tier = 2 },
]
open_prefix = 1
open_suffix = 1

[[steps]]
item = "a"
do = ["buy:base"]

[[steps]]
item = "a"
do = ["transmutation", "alteration"]
until = "block"

[[steps]]
item = "b"
do = ["buy:base"]

[[steps]]
item = "b"
do = ["transmutation", "alteration"]
until = "spell_block"

[[steps]]
do = ["bench:any-mod", "recombinator:a+b", "bench:prefixes-cannot-be-changed", "scouring"]
until = "blocks"
max = 1
else = 1

[[steps]]
do = ["bench:remove-crafted", "bench:multimod", "bench:prefixes-cannot-be-changed", "bench:any-prefix", "harvest:reforge-critical", "bench:remove-crafted"]
until = "critical"

[[steps]]
do = ["bench:prefixes-cannot-be-changed", "harvest:add-remove-fire"]
until = "fire"
max = 1
else = 5

[[steps]]
do = ["bench:remove-crafted", "bench:fire-and-chaos-resistance", "influence-exalted:crusader"]
until = "goal"
max = 1
else = 5
