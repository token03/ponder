sheet = "Socketed CastSpeed ES Gloves"
base = "Sorcerer Gloves"
quality = 27

[goal]
mods = [
  { text = "Socketed Gems have #% more Attack and Cast Speed", source = "essence", fractured = true },
  { text = "+# to maximum Energy Shield", source = "essence" },
  { text = "+# to Intelligence", tier = 2 },
]

[stages.insanity_four_mods]
mods = [{ text = "Socketed Gems have #% more Attack and Cast Speed", source = "essence" }]
min_mods = 4
max_mods = 4

[stages.fractured]
mods = [{ text = "Socketed Gems have #% more Attack and Cast Speed", source = "essence", fractured = true }]

[stages.energy_shield]
mods = [
  { text = "Socketed Gems have #% more Attack and Cast Speed", source = "essence", fractured = true },
  { text = "+# to maximum Energy Shield", source = "essence" },
]

[[steps]]
do = ["buy:base"]

[[steps]]
do = ["essence:insanity"]
until = "insanity_four_mods"

[[steps]]
do = ["fracturing"]
until = "fractured"
max = 1
else = 1

[[steps]]
do = ["essence:deafening-woe"]
until = "energy_shield"
note = "Repeat until the energy shield total is satisfying (320+)."

[[steps]]
do = ["eldritch-implicit:lesser-ichor", "bench:resistance", "exalted", "eldritch-annulment"]
until = "goal"
