sheet = "Cheap Ele Bow"
scope = "Method 2: start from a fractured damage bow."
base = "Spine Bow"
ilvl = 82

[goal]
mods = [
  { text = ["Adds # to # Fire Damage", "Adds # to # Cold Damage", "Adds # to # Lightning Damage"], tier = 2, count = 3 },
  { text = ["#% increased Attack Speed / +# to Dexterity and Intelligence", "#% increased Critical Strike Chance / +# to Strength and Intelligence"] }, # one, not two: both hybrids share the Intelligence family
]

[stages.fractured_base]
mods = [{ text = ["Adds # to # Fire Damage", "Adds # to # Cold Damage", "Adds # to # Lightning Damage"], tier = 2, fractured = true }]
price = 30.0 # rough market estimate, not from the guide

[stages.prefixes]
mods = [{ text = ["Adds # to # Fire Damage", "Adds # to # Cold Damage", "Adds # to # Lightning Damage"], tier = 2, count = 3 }]

[[steps]]
do = ["buy:fractured_base"]

[[steps]]
do = ["essence:deafening-wrath"]
until = "prefixes"
note = "Wrath, Anger or Hatred: whichever element the base lacks."

[[steps]]
do = ["bench:remove-crafted", "bench:prefixes-cannot-be-changed", "veiled-chaos", "bench:chaos-damage-over-time-multiplier", "unveil:speed-or-critical", "bench:remove-crafted", "bench:speed-or-critical"]
until = "goal"
