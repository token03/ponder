sheet = "Cheap Ele Bow"
scope = "Method 2: start from a fractured damage bow."
base = "Spine Bow"
ilvl = 82

[goal]
mods = [
  { text = ["Adds # to # Fire Damage", "Adds # to # Cold Damage", "Adds # to # Lightning Damage"], tier = 2, count = 3 },
  { text = ["#% increased Attack Speed / +# to Dexterity and Intelligence", "#% increased Critical Strike Chance / +# to Strength and Intelligence"], count = 2 },
]

[stages.fractured_base]
mods = [{ text = ["Adds # to # Fire Damage", "Adds # to # Cold Damage", "Adds # to # Lightning Damage"], fractured = true }]

[stages.prefixes]
mods = [{ text = ["Adds # to # Fire Damage", "Adds # to # Cold Damage", "Adds # to # Lightning Damage"], tier = 2, count = 3 }]

[[steps]]
do = ["buy:fractured_base"]

[[steps]]
do = ["essence:deafening-wrath"]
until = "prefixes"
note = "Wrath, Anger or Hatred: whichever element the base lacks."

[[steps]]
do = ["bench:prefixes-cannot-be-changed", "veiled-chaos", "bench:chaos-damage-over-time-multiplier", "unveil:speed-or-critical", "bench:speed-or-critical"]
until = "goal"
