sheet = "Dagger +2 ExplodeSynthBase"
scope = "Marked removed in 3.29: synthesis implicits moved to Vaal orbs. Kept as a historical case."
base = "Imperial Skean"

[goal]
mods = [
  { text = "+# to Level of all Spell Skill Gems", tier = "any" },
  { text = "+# to Level of all Physical Spell Skill Gems", tier = "any" },
  { text = ["#% increased Cast Speed", "#% increased Spell Critical Strike Chance"], tier = "any" },
]

[stages.spell_gems]
rarity = "magic"
mods = [{ text = "+# to Level of all Spell Skill Gems", tier = "any" }]
max_suffix = 0

[stages.regalled]
rarity = "rare"
mods = [{ text = "+# to Level of all Spell Skill Gems", tier = "any" }]
max_prefix = 1
max_suffix = 0

[stages.prefixes]
mods = [{ text = "+# to Level of all Spell Skill Gems", tier = "any" }, { text = "+# to Level of all Physical Spell Skill Gems", tier = "any" }]

[[steps]]
do = ["buy:base", "scouring", "transmutation", "alteration", "annulment"]
until = "spell_gems"

[[steps]]
do = ["restore", "imprint", "regal", "annulment"]
until = "regalled"
note = "Regal, then annul the new mod; restore the imprint when the annulment takes the spell gems."

[[steps]]
do = ["bench:multimod", "bench:cannot-roll-attack", "bench:prefixes-cannot-be-changed", "harvest:augment-physical"]
until = "prefixes"

[[steps]]
do = ["bench:remove-crafted", "bench:multimod", "bench:prefixes-cannot-be-changed", "bench:any-prefix", "harvest:augment-caster"]
until = "goal"
