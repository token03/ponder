sheet = "+2MinionReservation Helmet"
scope = "The last prefix (socketed AoE craft or veiled +2 AoE) is optional and not modelled."
base = "Giantslayer Helmet"
quality = 28

[goal]
mods = [
  { text = "+# to Level of all Minion Skill Gems", tier = 1, fractured = true },
  { text = ["+#% to Fire Resistance", "+#% to Cold Resistance", "+#% to Lightning Resistance"], tier = 1 },
  { text = "+#% to Chaos Resistance", tier = 2 },
  { text = "+# to maximum Life", tier = 1 },
]

[stages.minion_four_mods]
mods = [{ text = "+# to Level of all Minion Skill Gems", tier = 1 }]
min_mods = 4
max_mods = 4

[stages.fractured]
mods = [{ text = "+# to Level of all Minion Skill Gems", tier = 1, fractured = true }]

[stages.resist]
mods = [
  { text = "+# to Level of all Minion Skill Gems", tier = 1, fractured = true },
  { text = ["+#% to Fire Resistance", "+#% to Cold Resistance", "+#% to Lightning Resistance"], tier = 1 },
]
open_suffix = 1

[stages.suffixes]
mods = [
  { text = "+# to Level of all Minion Skill Gems", tier = 1, fractured = true },
  { text = ["+#% to Fire Resistance", "+#% to Cold Resistance", "+#% to Lightning Resistance"], tier = 1 },
  { text = "+#% to Chaos Resistance", tier = 2 },
]

[[steps]]
do = ["buy:base"]
note = "Or buy a fractured +2 minion helmet and skip to step 4."

[[steps]]
do = ["harvest:reforge-minion", "annulment", "exalted"]
until = "minion_four_mods"

[[steps]]
do = ["fracturing"]
until = "fractured"
max = 1
else = 2

[[steps]]
do = ["essence:deafening-loathing"]
until = "resist"
note = "Loathing forces reservation efficiency on helmets."

[[steps]]
do = ["bench:suffixes-cannot-be-changed", "harvest:reforge-chaos"]
until = "suffixes"
max = 1
else = 4

[[steps]]
do = ["eldritch-implicit:lesser-ember", "bench:armour", "exalted", "eldritch-annulment"]
until = "goal"
