sheet = "1H Bleed Axe"
scope = "Method 1 (elder influence, essence of contempt). Tempering is not modelled."
base = "Runic Hatchet"

[goal]
influences = ["elder"]
mods = [
  { text = "Adds # to # Physical Damage", tier = 2 },
  { text = "+#% to Damage over Time Multiplier for Bleeding from Hits with this Weapon", tier = 1 },
  { text = ["#% increased Physical Damage / #% chance to Blind Enemies on hit", "#% increased Physical Damage / #% chance to Impale Enemies on Hit with Attacks", "#% increased Physical Damage / #% chance to Poison on Hit", "#% increased Physical Damage / #% chance to cause Bleeding on Hit"], source = "veiled" },
  { text = "Hits with this Weapon have Culling Strike against Bleeding Enemies / #% increased Physical Damage" },
  { text = "+#% to Physical Damage over Time Multiplier", source = "crafted" },
]

[stages.elder]
influences = ["elder"]
mods = []

[stages.bleed]
influences = ["elder"]
mods = [{ text = "+#% to Damage over Time Multiplier for Bleeding from Hits with this Weapon", tier = 1 }]
open_prefix = 1
open_suffix = 1

[stages.physical]
influences = ["elder"]
mods = [
  { text = "+#% to Damage over Time Multiplier for Bleeding from Hits with this Weapon", tier = 1 },
  { text = ["#% increased Physical Damage / #% chance to Blind Enemies on hit", "#% increased Physical Damage / #% chance to Impale Enemies on Hit with Attacks", "#% increased Physical Damage / #% chance to Poison on Hit", "#% increased Physical Damage / #% chance to cause Bleeding on Hit"], source = "veiled" },
]

[stages.culling]
influences = ["elder"]
mods = [
  { text = "+#% to Damage over Time Multiplier for Bleeding from Hits with this Weapon", tier = 1 },
  { text = ["#% increased Physical Damage / #% chance to Blind Enemies on hit", "#% increased Physical Damage / #% chance to Impale Enemies on Hit with Attacks", "#% increased Physical Damage / #% chance to Poison on Hit", "#% increased Physical Damage / #% chance to cause Bleeding on Hit"], source = "veiled" },
  { text = "Hits with this Weapon have Culling Strike against Bleeding Enemies / #% increased Physical Damage" },
]

[[steps]]
do = ["buy:base", "alchemy", "influence-exalted:elder"]
until = "elder"

[[steps]]
do = ["essence:deafening-contempt"]
until = "bleed"

[[steps]]
do = ["bench:prefixes-cannot-be-changed", "veiled-chaos", "unveil:physical-damage"]
until = "physical"
max = 1
else = 2

[[steps]]
do = ["bench:prefixes-cannot-be-changed", "harvest:reforge-physical"]
until = "culling"
max = 1
else = 2

[[steps]]
do = ["bench:accuracy-strength-and-dexterity", "exalted", "bench:remove-crafted", "bench:physical-damage-over-time-multiplier"]
until = "goal"
max = 1
else = 4
note = "The accuracy craft blocks a prefix for the exalt; full suffixes go back to the reforge."
