sheet = "ama-328-holy-relic-trigger-sword"
source = "https://www.reddit.com/r/PathOfExileBuilds/comments/1rtfhfp/comment/oajpqaz/"
scope = "Non-influenced thrusting sword. Attack speed uses the T2-or-better default; the complete affix finish is part of the predicate."
base = "Jewelled Foil"
ilvl = 86

[goal]
mods = [
  { text = "Minions deal #% increased Damage", tier = 2 },
  { text = "#% increased Attack Speed" },
  { text = "+# to Level of Socketed Gems", source = "natural" },
  { text = "Trigger a Socketed Spell when you Use a Skill, with a # second Cooldown / Spells Triggered this way have #% more Cost", source = "crafted" },
  { text = "Hits can't be Evaded", source = "crafted" },
]

[stages.pair]
mods = [
  { text = "Minions deal #% increased Damage", tier = 2 },
  { text = "#% increased Attack Speed" },
]

[stages.isolated_5]
mods = [
  { text = "Minions deal #% increased Damage", tier = 2 },
  { text = "#% increased Attack Speed" },
]
rarity = "rare"
max_mods = 5

[stages.isolated_4]
mods = [
  { text = "Minions deal #% increased Damage", tier = 2 },
  { text = "#% increased Attack Speed" },
]
