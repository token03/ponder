[stages.gems]
mods = [
  { text = "Minions deal #% increased Damage", tier = 2 },
  { text = "#% increased Attack Speed" },
  { text = "+# to Level of Socketed Gems", source = "natural" },
]

[[steps]]
do = ["buy:base"]

[[steps]]
do = ["essence:deafening-fear"]
until = "pair"

[[steps]]
do = ["annulment"]
until = "isolated_5"
max = 1
else = 2

[[steps]]
do = ["annulment"]
until = "isolated_4"
max = 1
else = 2

[[steps]]
do = ["annulment"]
until = "isolated_3"
max = 1
else = 2

[[steps]]
do = ["annulment"]
until = "isolated_2"
max = 1
else = 2

[[steps]]
do = ["bench:multimod", "bench:cannot-roll-attack"]
until = "blocked"
max = 1
else = 1

[[steps]]
do = ["exalted"]
until = "gems"
max = 1
else = 1

[[steps]]
do = ["bench:remove-crafted", "bench:multimod", "bench:trigger-on-skill-use", "bench:hits-cannot-be-evaded"]
until = "goal"
max = 1
else = 1
