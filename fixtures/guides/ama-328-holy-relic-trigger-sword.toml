max_mods = 3

[stages.isolated_2]
mods = [
  { text = "Minions deal #% increased Damage", tier = 2 },
  { text = "#% increased Attack Speed" },
]
rarity = "rare"
max_mods = 2

[stages.blocked]
mods = [
  { text = "Minions deal #% increased Damage", tier = 2 },
  { text = "#% increased Attack Speed" },
  { text = "Can have up to # Crafted Modifiers", source = "crafted" },
  { text = "Cannot roll Attack Modifiers", source = "crafted" },
]
max_prefix = 1
