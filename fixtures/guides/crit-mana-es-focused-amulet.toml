[[steps]]
do = ["buy:base"]

[[steps]]
do = ["essence:deafening-woe"]
until = "mana"

[[steps]]
do = ["annulment"]
until = "mana_two_prefixes"
max = 1
else = 2

[[steps]]
do = ["bench:prefixes-cannot-be-changed", "harvest:reforge-critical"]
until = "goal"
max = 1
else = 2

