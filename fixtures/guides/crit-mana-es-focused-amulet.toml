ilvl = 86

[goal]
mods = [
  { text = "#% increased maximum Energy Shield", source = "essence" },
  { text = "+# to maximum Mana", tier = 1 },
  { text = "+#% to Global Critical Strike Multiplier", tier = 1 },
]

[stages.mana]
mods = [{ text = "+# to maximum Mana", tier = 1 }]

[stages.mana_two_prefixes]
mods = [{ text = "+# to maximum Mana", tier = 1 }]
