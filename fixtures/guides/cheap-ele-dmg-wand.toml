sheet = "Cheap Ele Dmg Wand"
scope = "Quality and the Harvest enchant are not modelled."
base = "Prophecy Wand"

[goal]
mods = [
  { text = "Adds # to # Lightning Damage", fractured = true, tier = 2 },
  { text = "Adds # to # Cold Damage", tier = 2 },
  { text = ["+#% to Global Critical Strike Multiplier", "#% increased Critical Strike Chance"], tier = 1 },
  { text = "Can have up to # Crafted Modifiers", source = "crafted" },
  { text = "#% increased Spell Damage", source = "crafted" },
  { text = ["+#% to Global Critical Strike Multiplier", "#% increased Critical Strike Chance"], source = "crafted" },
]

[stages.lightning]
mods = [{ text = "Adds # to # Lightning Damage", tier = 2 }]
min_mods = 4
max_mods = 4

[stages.fractured]
mods = [{ text = "Adds # to # Lightning Damage", fractured = true, tier = 2 }]

[stages.multiplier]
mods = [
  { text = "Adds # to # Lightning Damage", fractured = true, tier = 2 },
  { text = "Adds # to # Cold Damage", tier = 2 },
  { text = ["+#% to Global Critical Strike Multiplier", "#% increased Critical Strike Chance"], tier = 1 },
]

[stages.craft_ready]
mods = [
  { text = "Adds # to # Lightning Damage", fractured = true, tier = 2 },
  { text = "Adds # to # Cold Damage", tier = 2 },
  { text = ["+#% to Global Critical Strike Multiplier", "#% increased Critical Strike Chance"], tier = 1 },
]
open_prefix = 1
open_suffix = 2

[[steps]]
do = ["buy:base"]

[[steps]]
do = ["essence:deafening-wrath"]
until = "lightning"

[[steps]]
do = ["fracturing"]
until = "fractured"
max = 1
else = 1

[[steps]]
do = ["bench:remove-crafted", "essence:deafening-hatred"]
until = "multiplier"

[[steps]]
do = ["annulment"]
until = "craft_ready"
max = 3
else = 4

[[steps]]
do = ["bench:multimod", "bench:spell-damage", "bench:critical-strike-chance", "bench:critical-strike-multiplier"]
until = "goal"
max = 1
else = 4
note = "A caster damage prefix blocks the spell damage craft: back to the essence."
