sheet = "Cheap Ele Dmg Wand"
scope = "Quality and the Harvest enchant are not modelled."
base = "Prophecy Wand"

[goal]
mods = [
  { text = "Adds # to # Lightning Damage to Spells", fractured = true, source = "essence" },
  { text = "+#% to Global Critical Strike Multiplier", tier = 1 },
  { text = "Can have up to # Crafted Modifiers", source = "crafted" },
  { text = "#% increased Spell Damage", source = "crafted" },
]

[stages.lightning]
mods = [{ text = "Adds # to # Lightning Damage to Spells", source = "essence" }]
min_mods = 4
max_mods = 4

[stages.fractured]
mods = [{ text = "Adds # to # Lightning Damage to Spells", fractured = true, source = "essence" }]

[stages.multiplier]
mods = [
  { text = "Adds # to # Lightning Damage to Spells", fractured = true, source = "essence" },
  { text = "+#% to Global Critical Strike Multiplier", tier = 1 },
]

[[steps]]
do = ["buy:base"]

[[steps]]
do = ["essence:deafening-wrath"]
until = "lightning"

[[steps]]
do = ["fracturing"]
until = "fractured"
max = 1
else = 2

[[steps]]
do = ["essence:deafening-hatred"]
until = "multiplier"

[[steps]]
do = ["bench:multimod", "bench:spell-damage", "bench:critical-strike-multiplier"]
until = "goal"
