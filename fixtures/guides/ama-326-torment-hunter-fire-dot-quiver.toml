open_suffix = 1

[[steps]]
do = ["buy:base"]

[[steps]]
do = ["essence:deafening-torment"]
until = "pair"

[[steps]]
do = ["annulment"]
until = "isolated_5"
max = 1
else = 2

[[steps]]
do = ["annulment"]
until = "isolated_4"
max = 1
else = 2

[[steps]]
do = ["annulment"]
until = "isolated_3"
max = 1
else = 2

[[steps]]
do = ["annulment"]
until = "isolated_2"
max = 1
else = 2

[[steps]]
do = ["bench:multimod", "bench:cannot-roll-attack", "exalted", "exalted"]
until = "prefixes"
max = 1
else = 1

[[steps]]
do = ["bench:remove-crafted", "bench:attack-speed"]
until = "ready"
max = 1
else = 1

[[steps]]
do = ["influence-exalted:hunter"]
until = "goal"
max = 1
else = 1
